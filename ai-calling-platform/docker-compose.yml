version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.dev
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["bash","-lc","alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  worker:
    build: ./backend
    env_file:
      - ./backend/.env.dev
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: ["bash","-lc","celery -A app.tasks.celery_app worker -l info"]

  scheduler:
    build: ./backend
    env_file:
      - ./backend/.env.dev
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: ["bash","-lc","celery -A app.tasks.celery_app beat -l info"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
    command: ["bash","-lc","pnpm install && pnpm dev --host"]

volumes:
  pgdata:
  minio: